<style>
:root{--paper:#f2f3ee;--silver:#9a9d9f;--holo:linear-gradient(115deg,#fff,#c8d6ff 22%,#ffc9f0 44%,#c9ffe8 66%,#eae0ff 84%,#fff);--ease:cubic-bezier(.19,1,.22,1)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:var(--paper);font-family:'Bricolage Grotesque',system-ui,sans-serif;min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;overflow:hidden;position:relative}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 40%,transparent 50%,rgba(0,0,0,.7))}
.glass{width:clamp(70px,14vw,120px);height:auto;margin-bottom:2rem;filter:drop-shadow(0 0 40px rgba(201,255,232,.3));animation:sway 5s var(--ease) infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
h1{font-size:clamp(4rem,20vw,11rem);line-height:.9;font-weight:800;letter-spacing:-.04em;background:var(--holo);background-size:250% 250%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:holo 9s var(--ease) infinite}
@keyframes holo{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
p{font-family:'Instrument Serif',Georgia,serif;font-style:italic;color:var(--silver);font-size:clamp(1.1rem,3vw,1.5rem);margin:1.2rem 0 2.2rem;max-width:30ch}
a{display:inline-flex;align-items:center;gap:.5rem;font-weight:600;padding:.9rem 1.8rem;border-radius:46px;background:var(--paper);color:#000;text-decoration:none;transition:transform .35s var(--ease)}
a:hover{transform:translateY(-3px)}
</style>
</head>
