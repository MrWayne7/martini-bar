<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>QR para imprimir — Martini Bar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,sans-serif;background:#eee;color:#000;padding:20px}
.bar{max-width:900px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:center}.bar button{font:inherit;font-weight:700;padding:10px 18px;border-radius:99px;border:none;background:#000;color:#fff;cursor:pointer}
.sheet{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:#000;color:#fff;border-radius:16px;padding:22px 18px;text-align:center;break-inside:avoid}
.card img.qr{width:100%;background:#fff;border-radius:10px;padding:8px}
.card h2{font-size:22px;margin:12px 0 4px}.card p{font-size:13px;color:#ccc}.card .u{margin-top:8px;font-size:12px;color:#d8b46a;letter-spacing:.04em}
@media print{body{background:#fff;padding:0}.bar{display:none}.sheet{gap:10px}}
</style></head><body>
<div class="bar"><b>Códigos QR de Martini Bar</b><button onclick="print()">Imprimir</button></div>
<div class="sheet">
  <div class="card"><img class="qr" src="/assets/qr-resena.svg" alt="QR reseña"><h2>¿Te gustó la noche?</h2><p>Escanea y déjanos tu reseña en Google</p><div class="u">martinibar.live/resena</div></div>
  <div class="card"><img class="qr" src="/assets/qr-lista.svg" alt="QR lista"><h2>Ponte en la lista</h2><p>Tu pase con QR para el próximo sábado</p><div class="u">martinibar.live/lista</div></div>
  <div class="card"><img class="qr" src="/assets/qr-vip.svg" alt="QR VIP"><h2>Reserva tu mesa VIP</h2><p>Botella, balde y entradas desde $100</p><div class="u">martinibar.live/vip</div></div>
</div>
</body></html>
